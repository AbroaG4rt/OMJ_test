<!DOCTYPE strict>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - JLPT Simulation</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- AutoTable for jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        .result-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .score-display {
            text-align: center;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 auto 20px;
        }
        .quote-box {
            background: #fff;
            padding: 20px;
            border-left: 4px solid var(--accent-color);
            font-style: italic;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            .result-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="dashboard.html" class="logo">JLPT Platform</a>
        </div>
    </header>

    <main class="container" style="margin-top: 40px;">
        <div id="loadingBox" class="card" style="text-align:center;">
            <h3>Grading your answers...</h3>
        </div>

        <div id="resultContent" style="display:none;">
            <div class="result-layout">
                <div class="card fade-in">
                    <h2 style="text-align:center;">Your Score</h2>
                    <div class="score-display">
                        <div class="score-circle" id="scoreCircle">0%</div>
                        <p id="scoreText">You answered X out of Y correctly.</p>
                    </div>
                    
                    <div class="quote-box">
                        <p id="quoteText">"七転び八起き" (Fall down seven times, stand up eight.)</p>
                    </div>

                    <div style="margin-top: 30px; text-align: center; display: flex; gap: 15px; justify-content: center;">
                        <button class="btn btn-outline" id="downloadPdfBtn">Download PDF</button>
                        <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
                    </div>
                </div>

                <div class="card fade-in" style="animation-delay: 0.2s;">
                    <h3 style="text-align:center;">Performance Breakdown</h3>
                    <div style="position: relative; height:250px; width:100%; display:flex; justify-content:center;">
                        <canvas id="scoreChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="card fade-in" style="margin-top:20px;">
                <h3>Questions You Mastered</h3>
                <ul id="correctList" style="list-style:none; padding:0; margin-top:15px; font-size: 0.95rem;">
                </ul>
            </div>
        </div>
    </main>

    <script src="assets/js/result.js"></script>
</body>
</html>
